<!DOCTYPE html>
<html lang="en" data-theme="dark_gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}TG-Fox API{% endblock %}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/webapp/static/webapp/css/webapp.css">
</head>
<body>
  <div class="bg-fx" id="bgFx"><span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span><span class="shape s4"></span></div>

  <header class="topbar">
    <button class="icon-btn" id="drawerToggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="brand"><span class="brand-emoji">🦊</span> TG-Fox API</div>
    <div class="topbar-right">
      <span class="balance-pill" id="topBalance">$0.00</span>
      <span class="divider">|</span>
      <span class="rank-pill" id="topRank">VIP1</span>
      <button class="avatar" aria-label="Profile">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      </button>
    </div>
  </header>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <button class="icon-btn" id="drawerClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
      <div class="brand"><span class="brand-emoji">🦊</span> TG-Fox API</div>
    </div>
    <nav class="drawer-nav">
      <a href="/webapp/" class="nav-item {% if active=='account' %}active{% endif %}">Account</a>
      <a href="/webapp/buy" class="nav-item {% if active=='buy' %}active{% endif %}">Buy Account</a>
      <a href="/webapp/record" class="nav-item {% if active=='record' %}active{% endif %}">Record buy/sell</a>
      <button class="nav-item ghost" id="openThemes">🎨 Themes</button>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <!-- Themes modal -->
  <div class="modal-root" id="themesModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>Choose a theme</h3>
        <button class="icon-btn" data-close-modal aria-label="Close">✕</button>
      </div>
      <div class="accent-section"><div class="accent-title">ACCENT COLOR</div><div class="accent-row" id="accentRow"></div></div>
        <div class="theme-section-title">APPEARANCE</div>
        <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-root" id="confirmModal" hidden>
    <div class="modal small">
      <div class="modal-head"><h3 id="confirmTitle">Confirm</h3></div>
      <p id="confirmBody" class="muted"></p>
      <div class="modal-actions">
        <button class="btn ghost" data-close-modal>No, cancel</button>
        <button class="btn primary" id="confirmYes">Yes, buy</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="/webapp/static/webapp/js/webapp.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
